[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pettec-local"
version = "0.5.5"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25"]
homeassistant-test = ["homeassistant==2026.10.1", "pytest>=8", "pytest-asyncio>=0.25"]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.setuptools.package-data]
"custom_components.pettec_local" = ["*.json", "translations/*.json", "brand/*.png", "frontend/*.js", "services.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
