name: Publish protocol library

on:
  push:
    tags:
      - 'protocol-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pettec-protocol/pyproject.toml').read_text())['project']
          if os.environ['RELEASE_TAG'] != f"protocol-v{project['version']}":
              raise SystemExit('Release tag must match the protocol package version')
          PY
      - run: python -m pip install build twine pytest pytest-asyncio
      - run: python -m build pettec-protocol
      - run: python -m twine check pettec-protocol/dist/*
      - run: python -m pip install pettec-protocol/dist/*.whl
      - run: python -m pytest -q -c pettec-protocol/pyproject.toml pettec-protocol/tests
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-distributions
          path: pettec-protocol/dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: protocol-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
